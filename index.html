    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' ? window.fetch : null;
          var fetchDescriptor = {
            get: function() {
              return _origFetch;
            },
            set: function(v) {
              _origFetch = v;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (_) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (_) {}
          }
        } catch (_) {}

        // Shield app from third-party extension errors
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
               (event.message && (
                 event.message.indexOf('fetch of #<Window>') !== -1 ||
                 event.message.indexOf('chrome-extension') !== -1
               )))
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
